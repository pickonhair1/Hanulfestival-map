<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 한울제 부스 안내</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --card: #ffffff;
      --text: #1f2937;
      --sub: #6b7280;
      --line: #e5e7eb;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 22px;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #f8fbff 0%, #f5f6fa 100%);
      color: var(--text);
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .map-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 18px;
    }

    .map-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 6px;
    }

    .map-sub {
      margin: 0 0 14px;
      color: var(--sub);
      font-size: 13px;
      line-height: 1.6;
    }

    .map-box {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .map-box img {
      display: block;
      width: 100%;
      height: auto;
    }

    .hitbox {
      position: absolute;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      margin: 0;
    }

    .hitbox:focus-visible {
      outline: 2px solid rgba(37, 99, 235, 0.35);
      border-radius: 8px;
    }

    .hitbox.active {
      background: rgba(37, 99, 235, 0.14);
      border-radius: 8px;
      box-shadow: inset 0 0 0 2px rgba(37, 99, 235, 0.4);
    }

    .popup-card {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 570px;
      max-height: 64%;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(6px);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.22);
      padding: 18px 16px 16px;
      z-index: 20;
      display: none;
    }

    .popup-card.show {
      display: block;
    }

    .popup-close {
      position: absolute;
      top: 12px;
      right: 12px;
      border: none;
      background: #f3f4f6;
      color: #374151;
      width: 38px;
      height: 38px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
    }

    .popup-label {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #374151;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .popup-card h2 {
      margin: 0 44px 12px 0;
      font-size: 22px;
      line-height: 1.35;
      word-break: keep-all;
    }

    #boothImage {
      display: none;
      width: 100%;
      border-radius: 12px;
      margin-bottom: 14px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .popup-grid {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 10px 12px;
      font-size: 14px;
      line-height: 1.6;
    }

    .label {
      font-weight: 700;
      color: #4b5563;
    }

    .value {
      color: #111827;
      word-break: keep-all;
    }

    .empty {
      color: var(--sub);
    }

    .guide-box {
      margin-top: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 16px 18px;
      color: var(--sub);
      font-size: 14px;
      line-height: 1.7;
    }

    .hidden-row {
      display: none;
    }

    @media (max-width: 700px) {
      .wrap {
        padding: 16px 12px 32px;
      }

      .map-card {
        padding: 16px;
        border-radius: 20px;
      }

      .popup-card {
        width: calc(100% - 20px);
        max-width: none;
        max-height: 66%;
        padding: 18px 14px 14px;
      }

      .popup-card h2 {
        font-size: 20px;
      }

      .popup-grid {
        grid-template-columns: 68px 1fr;
        font-size: 14px;
        gap: 10px 12px;
      }

      .guide-box {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="map-card">
      <h3 class="map-title">축제 배치도</h3>
      <p class="map-sub">지도에서 정보를 알고싶으신 부스를 눌러주세요.</p>

      <div class="map-box">
        <img src="festival-map.jpg" alt="2026 한울제 배치도" />

        <!-- 상단 가로 줄 -->
        <button class="hitbox" data-number="15" aria-label="인공지능학과 부스" style="left: 24.5%; top: 8%; width: 8%; height: 3.2%;"></button>
        <button class="hitbox" data-number="7"  aria-label="미래전기자동차과 부스" style="left: 32.6%; top: 8.1%; width: 8%; height: 3.2%;"></button>
        <button class="hitbox" data-number="2"  aria-label="게임콘텐츠학과 부스" style="left: 41%; top: 8.2%; width: 8%; height: 3.2%;"></button>
        <button class="hitbox" data-number="6"  aria-label="모빌리티공학과 부스" style="left: 49.1%; top: 8.3%; width: 8%; height: 3.2%;"></button>
        <button class="hitbox" data-number="1"  aria-label="건축인테리어학과 부스" style="left: 57%; top: 8.4%; width: 8%; height: 3.2%;"></button>

        <!-- 왼쪽 세로 줄 -->
        <button class="hitbox" data-number="5"  aria-label="메카트로닉스공학과 부스" style="left: 9.5%; top: 19%; width: 3.7%; height: 5.8%;"></button>
        <button class="hitbox" data-number="12" aria-label="시각정보디자인학과 부스" style="left: 9.5%; top: 24.5%; width: 3.7%; height: 5.8%;"></button>
        <button class="hitbox" data-number="8"  aria-label="보건의료정보학과 부스" style="left: 9.5%; top: 30%; width: 3.7%; height: 5.8%;"></button>
        <button class="hitbox" data-number="13" aria-label="영상디자인과 부스" style="left: 9.5%; top: 35.5%; width: 3.7%; height: 5.8%;"></button>
        <button class="hitbox" data-number="18" aria-label="컴퓨터모바일융합과" style="left: 9.5%; top: 41%; width: 3.7%; height: 5.8%;"></button>
        <button class="hitbox" data-number="16" aria-label="전기공학과 부스" style="left: 9.5%; top: 46.5%; width: 3.7%; height: 5.8%;"></button>

        <!-- 왼쪽 안쪽 세로 -->
        <button class="hitbox" data-number="19" aria-label="국방군사학과 부스" style="left: 20.5%; top: 21%; width: 3.7%; height: 5%;"></button>
        <button class="hitbox" data-number="20" aria-label="디자인공학과 부스" style="left: 20.5%; top: 26.3%; width: 3.7%; height: 5%;"></button>
        <button class="hitbox" data-number="21" aria-label="패션디자인과 부스" style="left: 20.5%; top: 31.6%; width: 3.7%; height: 5%;"></button>

        <!-- 오른쪽 세로 줄 -->
        <button class="hitbox" data-number="17" aria-label="전자공학과 부스" style="left: 77%; top: 21.7%; width: 3.7%; height: 5.8%;"></button>
        <button class="hitbox" data-number="11" aria-label="건축소방학과 부스" style="left: 77%; top: 27.6%; width: 3.7%; height: 5.8%;"></button>
        <button class="hitbox" data-number="4"  aria-label="기계공학과 부스" style="left: 77%; top: 33.5%; width: 3.7%; height: 5.8%;"></button>
        <button class="hitbox" data-number="3"  aria-label="경영학과 부스" style="left: 77%; top: 43.2%; width: 3.7%; height: 5.8%;"></button>
        <button class="hitbox" data-number="14" aria-label="웹툰일러스트학과 부스" style="left: 77%; top: 48.9%; width: 3.7%; height: 5.8%;"></button>
        <button class="hitbox" data-number="10" aria-label="생명화학공학과 부스" style="left: 77%; top: 54.6%; width: 3.7%; height: 5.8%;"></button>
        <button class="hitbox" data-number="9"  aria-label="사회복지학과 부스" style="left: 77%; top: 60.3%; width: 3.7%; height: 5.8%;"></button>

        <!-- 특수 구역 -->
        <button class="hitbox" data-number="P1" aria-label="플리마켓" style="left: 66.2%; top: 21%; width: 4.6%; height: 27.5%;"></button>
        <button class="hitbox" data-number="C1" aria-label="동아리" style="left: 20.5%; top: 37%; width: 3.7%; height: 15.8%;"></button>
        <button class="hitbox" data-number="A1" aria-label="AMB" style="left: 9.5%; top: 54%; width: 3.7%; height: 7%;"></button>
        <button class="hitbox" data-number="M1" aria-label="의무실" style="left: 9.5%; top: 61.1%; width: 3.7%; height: 6.7%;"></button>
        <button class="hitbox" data-number="F1" aria-label="학생회비존" style="left: 34%; top: 55.7%; width: 22%; height: 7.4%;"></button>
        <button class="hitbox" data-number="Z1" aria-label="푸드존" style="left: 90.2%; top: 18.5%; width: 9%; height: 22%;"></button>
        <button class="hitbox" data-number="S1" aria-label="총학" style="left: 41.4%; top: 14.4%; width: 8.3%; height: 3.3%;"></button>
        <button class="hitbox" data-number="G1" aria-label="오락" style="left: 50.7%; top: 14.4%; width: 8%; height: 3.3%;"></button>

        <div class="popup-card" id="popupCard">
          <button class="popup-close" id="popupClose" aria-label="닫기">×</button>
          <div class="popup-label">부스 상세 정보</div>
          <h2 id="boothName">정보를 확인할 부스를 눌러주세요</h2>

          <img id="boothImage" src="" alt="">

          <div class="popup-grid">
            <div class="label">구분</div>
            <div class="value empty" id="boothNumber">-</div>

            <div class="label">학과명</div>
            <div class="value empty" id="boothDept">-</div>

            <div class="label">부스종류</div>
            <div class="value empty" id="boothType">-</div>

            <div class="label menu-row-label" id="menuLabel">내용</div>
            <div class="value empty menu-row-value" id="boothMenu">-</div>
          </div>
        </div>
      </div>

      <div class="guide-box">
        배치도에서 원하는 부스 이름 영역을 누르면 지도 위에서 상세 정보를 확인할 수 있습니다. (59대 총학생회 제작)
      </div>
    </section>
  </div>

  <script>
    const boothData = [
      { number: '1',  name: '건축인테리어학과', dept: '건축인테리어학과', type: '주점', menu: '', image: '건인.jpg' },
      { number: '2',  name: '게임콘텐츠학과', dept: '게임콘텐츠학과', type: '주점', menu: '', image: '겜콘.png' },
      { number: '3',  name: '경영학과', dept: '경영학과', type: '주점', menu: '', image: '경영.jpg' },
      { number: '4',  name: '기계공학과', dept: '기계공학과', type: '주점', menu: '', image: '기공.jpg' },
      { number: '5',  name: '메카트로닉스공학과', dept: '메카트로닉스공학과', type: '주점', menu: '', image: '메카.png' },
      { number: '6',  name: '모빌리티공학과', dept: '모빌리티공학과', type: '소개팅부스 + 주점', menu: '', image: '모빌.png' },
      { number: '7',  name: '미래전기자동차과', dept: '미래전기자동차과', type: '주점', menu: '감바스, 뇨끼' },
      { number: '8',  name: '보건의료정보학과', dept: '보건의료정보학과', type: '주점', menu: '', image: '보건.png' },
      { number: '9',  name: '사회복지학과', dept: '사회복지학과', type: '주점', menu: '훈제오리 부추무침, 고기두부김치, 계란말이, 콘치즈전' },
      { number: '10', name: '생명화학공학과', dept: '생명화학공학과', type: '주점', menu: '', image: '생화공.png' },
      { number: '11', name: '건축소방학과', dept: '건축소방학과', type: '주점', menu: '팥빙수, 크로플, 오레오빙수' },
      { number: '12', name: '시각정보디자인학과', dept: '시각정보디자인학과', type: '주점', menu: '', image: '시디.jpg' },
      { number: '13', name: '영상디자인과', dept: '영상디자인과', type: '주점', menu: '볶음우동, 쏘야, 치즈계란말이, 버터갈릭감자튀김, 황도' },
      { number: '14', name: '웹툰일러스트학과', dept: '웹툰일러스트학과', type: '주점', menu: '부대찌개' },
      { number: '15', name: '인공지능학과', dept: '인공지능학과', type: '소개팅부스 + 주점', menu: '', image: '인공.PNG' },
      { number: '16', name: '전기공학과', dept: '전기공학과', type: '주점', menu: '', image: '전기.png' },
      { number: '17', name: '전자공학과', dept: '전자공학과', type: '주점', menu: '감자튀김, 소시지, 유린기' },
      { number: '18', name: '컴퓨터모바일융합과', dept: '컴퓨터모바일융합과', type: '주점', menu: '치킨, 칠리스, 감자튀김' },
      { number: '19', name: '국방군사학과', dept: '국방군사학과', type: '이벤트', menu: '', image: '군사.jpg' },
      { number: '20', name: '디자인공학과', dept: '디자인공학과', type: '이벤트', menu: '다트 풍선 터트리기, 폴라로이드 포토존, 페이스페인팅' },
      { number: '21', name: '패션디자인과', dept: '패션디자인과', type: '이벤트', menu: '', image: '패디.png' },

      { number: 'P1', name: '플리마켓', dept: '플리마켓', type: '체험 부스', menu: '타로카드, 양말목키링, 모루응원봉, 애완돌 만들기, 나비/얼굴 방명록 활동' },
      { number: 'C1', name: '동아리', dept: '동아리 부스', type: '홍보 / 체험', menu: '종합게임, 잔상, DAP, 농구, 볼텍스, 축구 이런 동아리가 있습니다.' },
      { number: 'A1', name: 'AMB', dept: 'AMB', type: '안전 안내', menu: 'AMB는 앰뷸런스(구급차)를 의미합니다.' },
      { number: 'M1', name: '의무실', dept: '의무실', type: '의료 지원', menu: '의무실 공간이며 보건 선생님 대기' },
      { number: 'F1', name: '학생회비존', dept: '학생회비존', type: '전용 관람 구역', menu: '학생회비를 낸 학생들을 위한 무대를 가까이서 볼 수 있는 공간입니다.' },
      { number: 'Z1', name: '푸드존', dept: '푸드존', type: '푸드트럭 구역', menu: '푸드트럭 6대 디저트류 4대, 식사류 2대 / 밥류: 야끼소바, 곱창(막창)볶음, 큐브스테이크, 소고기초밥, 마라탕, 볶음밥 / 디저트류: 마카롱, 와플, 츄러스, 핫도그, 칠리새우, 크림새우, 크로플, 컵빙수, 철판 아이스크림, 토스트, 붕어빵 아이스크림, 파르페, 새우튀김, 닭똥집, 컵인절미팥빙수, 홍콩와플' },
      { number: 'S1', name: '총학', dept: '총학생회', type: '운영 부스', menu: '타투(헤나), 슬러시, 방명록' },
      { number: 'G1', name: '오락', dept: '오락 부스', type: '체험 부스', menu: 'GT, 키링 뽑기, 펀치 기계, 축구공 펀치 기계, 두더지 잡기' }
    ];

    const boothName = document.getElementById('boothName');
    const boothNumber = document.getElementById('boothNumber');
    const boothDept = document.getElementById('boothDept');
    const boothType = document.getElementById('boothType');
    const boothMenu = document.getElementById('boothMenu');
    const boothImage = document.getElementById('boothImage');
    const menuLabel = document.getElementById('menuLabel');
    const popupCard = document.getElementById('popupCard');
    const popupClose = document.getElementById('popupClose');
    const hitboxes = document.querySelectorAll('.hitbox');

    function setActive(number) {
      hitboxes.forEach(box => {
        box.classList.toggle('active', box.dataset.number === number);
      });
    }

    function fillInfo(number) {
      const booth = boothData.find(item => item.number === number);
      if (!booth) return;

      boothName.textContent = booth.name;
      boothNumber.textContent = booth.number;
      boothDept.textContent = booth.dept;
      boothType.textContent = booth.type;

      if (booth.image) {
        boothImage.src = booth.image;
        boothImage.alt = booth.name + ' 메뉴판';
        boothImage.style.display = 'block';
        menuLabel.classList.add('hidden-row');
        boothMenu.classList.add('hidden-row');
        boothMenu.textContent = '';
      } else {
        boothImage.src = '';
        boothImage.alt = '';
        boothImage.style.display = 'none';
        menuLabel.classList.remove('hidden-row');
        boothMenu.classList.remove('hidden-row');
        boothMenu.textContent = booth.menu || '-';
      }

      [boothNumber, boothDept, boothType].forEach(el => {
        el.classList.remove('empty');
      });

      if (!booth.image) {
        boothMenu.classList.remove('empty');
      }

      setActive(number);
      popupCard.classList.add('show');
    }

    hitboxes.forEach(box => {
      box.addEventListener('click', () => fillInfo(box.dataset.number));
    });

    popupClose.addEventListener('click', () => {
      popupCard.classList.remove('show');
      hitboxes.forEach(box => box.classList.remove('active'));
    });
  </script>
</body>
</html>
